# Personal defaults; project-specific overrides belong in .workmux.yaml.
agent: pi
mode: window
worktree_dir: ../{project}__worktrees
status_icons:
  working: "🤖"
  waiting: "💬"
  done: "✅"
sidebar:
  layout: compact
  enter_actions: focus

panes:
  - command: nvim
    focus: true
  - command: <agent>
    split: horizontal # Second pane with default shell
    percentage: 30

nerdfont: true
