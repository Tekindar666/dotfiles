"$schema" = 'https://starship.rs/config-schema.json'

format = '$directory$git_metrics$line_break$character'
add_newline = true

[directory]
style = 'fg:#81A1C1'
format = ' [$path]($style)'
truncation_length = 0
truncate_to_repo = false

[git_metrics]
disabled = false
added_style = 'fg:#475266'
deleted_style = 'fg:#475266'
format = '( [+$added]($added_style))( [-$deleted]($deleted_style))'

[character]
format = ' $symbol '
success_symbol = '[❯](fg:#BFBDB6)'
error_symbol = '[❯](fg:#BFBDB6)'
vimcmd_symbol = '[](fg:#BFBDB6)'
