# Basic settings
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g detach-on-destroy off

# enable mouse
set -g mouse on
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# Clipboard: accept OSC 52 from applications, then mirror the resulting buffer to
# the system clipboard. tmux stores application OSC 52 as a paste buffer but does
# not forward it to the outer terminal, so the hook does that leg.
set -s set-clipboard on
set-hook -g pane-set-clipboard 'run-shell -b "~/.config/tmux/scripts/copy-clipboard"'

set -g status-position bottom
set -gq allow-passthrough on
set -s extended-keys on
# set -as terminal-features ',xterm-kitty:extkeys'
set -g extended-keys-format csi-u
# set -g visual-activity off

# Change prefix from C-b to C-a
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Split panes bindings
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Resize panes (5 cell increments for smooth resizing)
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z  # Maximize/minimize pane

bind s choose-tree -Zs
bind c new-window
bind o last-window
bind C new-session
bind X confirm-before -p "Kill session #S? (y/n)" kill-session
bind v copy-mode
# Scratch popup: attaches a persistent "scratch" session so its state survives
# closing the popup. Toggle with prefix+f or C-f (C-f passes through elsewhere).
unbind f
bind f if-shell -F '#{==:#{session_name},scratch}' {
  detach-client
} {
  display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "tmux new-session -A -s scratch"
}
unbind -n C-f
bind -n C-f if-shell -F '#{==:#{session_name},scratch}' {
  detach-client
} {
  send-keys C-f
}
unbind b
bind b display-popup -EE -w 30% -h 30% -d "#{pane_current_path}" -T "New background window" ~/.config/tmux/scripts/background-command

# Improve colors and enable focus events
set -g focus-events on
set -sg escape-time 0

set -g base-index 0
setw -g pane-base-index 0

# Status bar - Nord-inspired, transparent
set -g status-style "bg=default"
set -g status-interval 5
set -g status-justify absolute-centre

# Left: session name
set -g status-left-length 50
set -g status-left "#[fg=#88c0d0,bold] #S "

# Middle: window list
set -g window-status-separator " "
setw -g window-status-style "fg=#d8dee9,bg=#3b4252"
setw -g window-status-current-style "fg=#2e3440,bg=#88c0d0,bold"
setw -g window-status-bell-style "fg=#2e3440,bg=#a3be8c,bold"
setw -g window-status-format " #I:#W#{?window_bell_flag, ✓,} "
setw -g window-status-current-format " #I:#W "

# Right: git branch
set -g status-right-length 60
set -g status-right "#[fg=#a3be8c]#{?#{!=:#(cd #{pane_current_path} && git rev-parse --abbrev-ref HEAD 2>/dev/null),}, #(cd #{pane_current_path} && git rev-parse --abbrev-ref HEAD 2>/dev/null),} "

# Pane borders - subtle
set -g pane-border-style "fg=#3b4252"
set -g pane-active-border-style "fg=#88c0d0"
set -g pane-border-indicators both

# Message style
set -g message-style "fg=#d8dee9,bg=#3b4252"
setw -g mode-style "fg=#eceff4,bg=#5e81ac,bold"

# TPM plugins
TMUX_FZF_LAUNCH_KEY="F"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Continuum configuration
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
