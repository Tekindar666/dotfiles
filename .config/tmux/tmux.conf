# Basic settings
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g detach-on-destroy off

# enable mouse
set -g mouse on
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# Clipboard: accept OSC 52 from applications, then mirror the resulting buffer to
# the system clipboard. tmux stores application OSC 52 as a paste buffer but does
# not forward it to the outer terminal, so the hook does that leg.
set -s set-clipboard on
set-hook -g pane-set-clipboard 'run-shell -b "~/.config/tmux/scripts/copy-clipboard"'

set -g status-position top
set -gq allow-passthrough on
set -s extended-keys on
# set -as terminal-features ',xterm-kitty:extkeys'
set -g extended-keys-format csi-u
# set -g visual-activity off

# Change prefix from C-b to C-a
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Split panes bindings
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Resize panes (5 cell increments for smooth resizing)
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z  # Maximize/minimize pane

bind s run-shell -b "TMUX_FZF_CLIENT='#{client_tty}' ~/.config/tmux/scripts/session-switcher"
bind S choose-tree -Zs
bind c new-window
bind o last-window
bind C new-session
bind X confirm-before -p "Kill session #S? (y/n)" kill-session
bind v copy-mode
# Floating popup: attaches a persistent "floating" session so its state survives
# closing the popup. Toggle with prefix+f or C-f (C-f passes through elsewhere).
unbind f
bind f if-shell -F '#{==:#{session_name},floating}' {
  detach-client
} {
  display-popup -E -w 80% -h 80% -d "#{pane_current_path}" ~/.config/tmux/scripts/floating-terminal
}
unbind -n C-f
bind -n C-f if-shell -F '#{==:#{session_name},floating}' {
  detach-client
} {
  send-keys C-f
}
unbind b
bind b run-shell -b 'workmux sidebar'

# Improve colors and enable focus events
set -g focus-events on
set -sg escape-time 0

set -g base-index 0
setw -g pane-base-index 0

# Local Dotbar baseline; edit themes/dotbar/dotbar.tmux for theme changes.
set -g status-interval 5
set -g status-left-length 50
set -g status-right-length 60
# Clear the previous selected-tab background/bold on config reload.
setw -g window-status-current-style default
set -g @tmux-dotbar-bg default
set -g @tmux-dotbar-position top
set -g @tmux-dotbar-fg-current '#81A1C1'
set -g @tmux-dotbar-fg-prefix '#81A1C1'
set -g @tmux-dotbar-right true
set -g @tmux-dotbar-status-right-text ' #(~/.config/tmux/scripts/git-branch #{q:pane_current_path}) '
# Keep SSH window names; avoid passing pane titles through a shell.
set -g @tmux-dotbar-ssh-icon-only true
run 'bash ~/.config/tmux/themes/dotbar/dotbar.tmux'

# Pane borders - subtle, with an active-pane label for clearer left/right focus
set -g pane-border-style "fg=#3b4252"
set -g pane-active-border-style "fg=#81A1C1"
set -g pane-border-indicators both
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#81A1C1,bold]▶ ,}#{pane_index}:#{pane_current_command}"

# Message style
set -g message-style "fg=#d8dee9,bg=#3b4252"
set -g message-command-style "fg=#2e3440,bg=#81A1C1"
setw -g mode-style "fg=#2e3440,bg=#81A1C1,bold"
set -g menu-selected-style "fg=#2e3440,bg=#81A1C1,bold"
set -g menu-border-style "fg=#81A1C1"
set -g popup-border-style "fg=#81A1C1"
set -g display-panes-active-colour '#81A1C1'

# TPM plugins
TMUX_FZF_LAUNCH_KEY="F"
# Plugin-local Nord styling; leave shell/other fzf pickers unchanged.
TMUX_FZF_PREVIEW="0"
TMUX_FZF_OPTIONS="-p -w 70% -h 45% -m --border=rounded --layout=reverse --info=hidden --no-separator --color=fg:#d8dee9,bg:#2e3440,fg+:#2e3440,bg+:#81A1C1,hl:#81A1C1,hl+:#2e3440,prompt:#81A1C1,pointer:#81A1C1,marker:#81A1C1,spinner:#81A1C1,border:#81A1C1,gutter:#2e3440"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Continuum configuration
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
